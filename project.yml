name: PlatformDeck
options:
  bundleIdPrefix: fr.dcreations
  deploymentTarget: { iOS: "18.0", macOS: "15.0", watchOS: "11.0" }
settings:
  base: { MARKETING_VERSION: "1.0", CURRENT_PROJECT_VERSION: "1", DEVELOPMENT_TEAM: "", CODE_SIGN_STYLE: Automatic, SWIFT_VERSION: "6.0", GENERATE_INFOPLIST_FILE: YES, INFOPLIST_KEY_CFBundleDisplayName: "Platform Deck", INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO, ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon }
targets:
  PlatformDeck:
    type: application
    platform: iOS
    sources: [Shared, iOS, Assets/iOS.xcassets]
    settings: { PRODUCT_BUNDLE_IDENTIFIER: fr.dcreations.platformdeck, INFOPLIST_KEY_UILaunchScreen_Generation: YES, TARGETED_DEVICE_FAMILY: "1,2", INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight" }
  PlatformDeckMac:
    type: application
    platform: macOS
    sources: [Shared, macOS, Assets/macOS.xcassets]
    settings: { PRODUCT_BUNDLE_IDENTIFIER: fr.dcreations.platformdeck, PRODUCT_NAME: "Platform Deck", INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education, ENABLE_APP_SANDBOX: YES }
  PlatformDeckWatch:
    type: application
    platform: watchOS
    sources: [Shared, Watch, Assets/Watch.xcassets]
    settings: { PRODUCT_BUNDLE_IDENTIFIER: fr.dcreations.platformdeck.watchkitapp, INFOPLIST_KEY_WKApplication: YES, INFOPLIST_KEY_WKWatchOnly: YES }
  PlatformDeckTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{ target: PlatformDeck }]
  PlatformDeckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{ target: PlatformDeck }]
    settings: { TEST_TARGET_NAME: PlatformDeck }
  PlatformDeckMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies: [{ target: PlatformDeckMac }]
    settings: { TEST_TARGET_NAME: PlatformDeckMac }
  PlatformDeckWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: [UITests]
    dependencies: [{ target: PlatformDeckWatch }]
    settings: { TEST_TARGET_NAME: PlatformDeckWatch }
schemes:
  PlatformDeck:
    build: { targets: { PlatformDeck: all } }
    test: { targets: [PlatformDeckTests, PlatformDeckUITests] }
  PlatformDeckMac:
    build: { targets: { PlatformDeckMac: all } }
    test: { targets: [PlatformDeckMacUITests] }
  PlatformDeckWatch:
    build: { targets: { PlatformDeckWatch: all } }
    test: { targets: [PlatformDeckWatchUITests] }
